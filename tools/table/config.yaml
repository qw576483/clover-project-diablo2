# clover-project-diablo2 打表配置
#
# 所有相对路径均相对于**本文件所在目录**（= `<项目根>/tools/table/`），一律取 `../../` 回到项目根：
#   planning_dir → <项目根>/策划/数值文档
#   client_dir   → <项目根>/client/Assets/Scripts/Table
# （只影响相对前缀写法，不改变任何字段名与产物落点。）

# 策划表目录：扫描其中的 *.xls / *.xlsx，每个工作表(sheet)即一张表。
# 源表 txt 与 -pack 生成的 xlsx 都平铺在这一层（单层扫描，不递归）。
planning_dir: "../../策划/数值文档"

# 客户端代码格式：固定 cs（C#）。
client_format: "cs"

# 本项目是**单机** ⇒ 不产出 Go 服务端代码；此路径只是打表工具要求的占位（产物落 .ai-tmp，不入库）。
server_dir: "../../.ai-tmp/table-discard/server"

# 客户端（cs）输出根目录：代码直接写入此目录（Base/ 子目录），tsv 写入 Tsv/ 子目录。
client_dir: "../../client/Assets/Scripts/Table"

# 第 3 行 cs 标记列为空时的默认侧。本项目单机 ⇒ 全部 `c`（源表第 3 行也已显式写 c）。
default_side: "c"

# 对照表输出：记录每个产物文件(tsv/代码)来自哪个 xls 的哪个 sheet（落 .ai-tmp，不入库）。
mapping_file: "../../.ai-tmp/table-discard/mapping.tsv"
